[package]
name = "ram-server"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.10"
prost = "0.12"
prost-types = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
rand = "0.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
bytes = "1.5"
tracing-appender = "0.2"

[[bin]]
name = "ram-server"
path = "src/main.rs"
